name: openstack-network-agents
summary: Neutron OVN metadata agent and helpers for Sunbeam network nodes
description: |
  Ships neutron-ovn-metadata-agent and configures provider bridge/physnet
  to support north-south and baremetal metadata. Intended to be driven by a
  Juju subordinate charm on network role nodes.
base: core24
version: "0.1"
license: BUSL-1.1
grade: devel
confinement: classic   # OVS socket access; consider strict later with plugs

apps:
  metadata-agent:
    command: files/bin/neutron-ovn-metadata-agent.wrapper
    daemon: simple
    install-mode: enable
  netctl:
    command: files/bin/netctl

parts:
  agents:
    plugin: dump
    source: .
    stage-packages:
      - neutron-common
      - neutron-ovn-metadata-agent
      - python3-neutron 
      - openvswitch-switch
      - iproute2
      - python3-jinja2
    organize:
      usr/bin/neutron-ovn-metadata-agent: files/bin/neutron-ovn-metadata-agent.real
    override-build: |
      set -euxo pipefail
      # run the default dump build first (Snapcraft 8 uses craftctl)
      craftctl default

      # copy our helpers from the repo into the part install dir explicitly
      install -D -m755 "$CRAFT_PROJECT_DIR/snap/files/bin/neutron-ovn-metadata-agent.wrapper" \
                       "$SNAPCRAFT_PART_INSTALL/files/bin/neutron-ovn-metadata-agent.wrapper"
      install -D -m755 "$CRAFT_PROJECT_DIR/snap/files/bin/netctl" \
                       "$SNAPCRAFT_PART_INSTALL/files/bin/netctl"
      install -D -m755 "$CRAFT_PROJECT_DIR/snap/files/bin/ensure-br-ex.sh" \
                       "$SNAPCRAFT_PART_INSTALL/files/bin/ensure-br-ex.sh"

      install -D -m644 "$CRAFT_PROJECT_DIR/snap/files/etc/neutron/neutron_ovn_metadata_agent.ini.tmpl" \
                       "$SNAPCRAFT_PART_INSTALL/files/etc/neutron/neutron_ovn_metadata_agent.ini.tmpl"

      install -D -m644 "$CRAFT_PROJECT_DIR/service/neutron-ovn-metadata-agent.service" \
                       "$SNAPCRAFT_PART_INSTALL/service/neutron-ovn-metadata-agent.service"

layout:
  /etc/neutron:
    bind: $SNAP_COMMON/etc/neutron

hooks:
  install:
    plugs: [network-bind, network, network-control]
  configure:
    plugs: [network-bind, network, network-control]